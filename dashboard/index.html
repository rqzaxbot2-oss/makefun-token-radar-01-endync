<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0f151d; --line:#1f2a37;
    --txt:#e6edf3; --dim:#8b98a5; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --hot:#f85149; --chip:#1b2430;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0b0f14f2,#0b0f14e0);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:18px;margin:0;letter-spacing:.3px}
  .brand .sub{color:var(--dim);font-size:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px;outline:none}
  input[type=search]{min-width:240px;flex:1 1 240px}
  input[type=search]:focus,select:focus{border-color:var(--accent2)}
  .toggle{display:flex;gap:6px;flex-wrap:wrap}
  .toggle button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:12px}
  .toggle button.on{color:var(--txt);border-color:var(--accent2);background:#16202c}
  main{padding:18px 20px 60px;max-width:1280px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:20px;font-weight:600;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  thead th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--txt)}
  tbody td{padding:10px 12px;border-bottom:1px solid #16202b;vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#141c26}
  tbody tr:last-child td{border-bottom:none}
  .rank{color:var(--dim);font-variant-numeric:tabular-nums;width:44px}
  .name{font-weight:600}
  .cat{color:var(--dim);font-size:12px}
  .val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);white-space:nowrap}
  .score{font-variant-numeric:tabular-nums;color:var(--accent2);white-space:nowrap}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .chip.hot{color:var(--hot);border-color:#4a1f1f}
  .chip.warn{color:var(--warn);border-color:#3d3317}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  .detail{position:fixed;inset:0;background:#05080bcc;display:none;z-index:50;overflow:auto;padding:30px 16px}
  .detail.open{display:block}
  .card{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  .card h2{margin:0 0 2px;font-size:22px}
  .card .meta{color:var(--dim);font-size:13px;margin-bottom:16px}
  .close{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;cursor:pointer}
  .close:hover{color:var(--txt)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
  .kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kv .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .kv .v{font-size:16px;font-weight:600;margin-top:2px}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:20px 0 8px}
  ol.steps{margin:0;padding-left:20px}
  ol.steps li{margin:6px 0}
  .why{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:10px 12px;color:#c9d3dd}
  .bar{height:6px;background:#1b2430;border-radius:4px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Token Launch Radar</h1>
    <span class="sub" id="sub">loading board…</span>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search protocol, category, chain…" autocomplete="off">
    <select id="cat"><option value="">All categories</option></select>
    <div class="toggle" id="toggles">
      <button data-f="all" class="on">All</button>
      <button data-f="top">Top 25</button>
      <button data-f="nodep">No token yet</button>
      <button data-f="high">High value</button>
    </div>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <table>
    <thead>
      <tr>
        <th data-sort="rank">#</th>
        <th data-sort="name">Protocol</th>
        <th data-sort="category">Category</th>
        <th data-sort="value">Implied value</th>
        <th data-sort="score">Launch score</th>
        <th>Signals</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No protocols match this filter.</div>
  <footer>Offline snapshot · ranked by what a launch would be worth · click any row for the farm plan</footer>
</main>

<div class="detail" id="detail">
  <div class="card" id="card"></div>
</div>

<script>
(function(){
  "use strict";
  var BOARD = window.__BOARD__ || null;
  var rows = [];
  var state = { q:"", cat:"", filter:"all", sort:"rank", dir:1 };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function num(v){ return typeof v==="number" && isFinite(v) ? v : 0; }
  function money(v){
    v = num(v);
    if(v >= 1e9) return "$"+(v/1e9).toFixed(2)+"B";
    if(v >= 1e6) return "$"+(v/1e6).toFixed(2)+"M";
    if(v >= 1e3) return "$"+(v/1e3).toFixed(1)+"K";
    return "$"+v.toFixed(0);
  }
  function pct(v){ return (num(v)*100).toFixed(0)+"%"; }

  function normalize(b){
    var list = [];
    if(Array.isArray(b)) list = b;
    else if(b && Array.isArray(b.board)) list = b.board;
    else if(b && Array.isArray(b.rows)) list = b.rows;
    else if(b && Array.isArray(b.protocols)) list = b.protocols;
    return list.map(function(r,i){
      var name = r.name || r.protocol || r.slug || ("protocol-"+i);
      var value = num(r.impliedValue != null ? r.impliedValue : (r.value != null ? r.value : r.valuation));
      var score = num(r.launchScore != null ? r.launchScore : (r.score != null ? r.score : r.rankScore));
      var plan = r.farmPlan || r.farm || r.plan || [];
      if(typeof plan === "string") plan = [plan];
      return {
        rank: num(r.rank) || (i+1),
        name: name,
        slug: r.slug || name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),
        category: r.category || r.sector || "Other",
        chains: r.chains || r.chain || [],
        value: value,
        score: score,
        hasToken: r.hasToken === true || r.token === true,
        tvl: num(r.tvl),
        revenue: num(r.revenue != null ? r.revenue : r.fees),
        volume: num(r.volume),
        users: num(r.users != null ? r.users : r.activeUsers),
        why: r.why || r.rationale || "",
        plan: plan,
        signals: r.signals || [],
        url: r.url || ""
      };
    });
  }

  function init(){
    rows = normalize(BOARD);
    rows.sort(function(a,b){ return a.rank - b.rank; });
    var cats = {};
    rows.forEach(function(r){ cats[r.category] = (cats[r.category]||0)+1; });
    var sel = document.getElementById("cat");
    Object.keys(cats).sort().forEach(function(c){
      var o = document.createElement("option");
      o.value = c; o.textContent = c+" ("+cats[c]+")";
      sel.appendChild(o);
    });
    document.getElementById("sub").textContent = rows.length+" protocols · no token yet · ranked by launch value";
    renderStats();
    render();
    bind();
  }

  function renderStats(){
    var total = rows.length;
    var sum = rows.reduce(function(a,r){ return a + r.value; }, 0);
    var top = rows.slice().sort(function(a,b){ return b.value - a.value; })[0];
    var high = rows.filter(function(r){ return r.score >= 70 || r.value >= 1e9; }).length;
    var el = document.getElementById("stats");
    el.innerHTML =
      stat("Protocols tracked", total) +
      stat("Combined implied value", money(sum)) +
      stat("Highest value", top ? esc(top.name) : "—") +
      stat("High-conviction", high);
  }
  function stat(k,v){ return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }

  function passes(r){
    if(state.cat && r.category !== state.cat) return false;
    if(state.q){
      var q = state.q.toLowerCase();
      var hay = (r.name+" "+r.category+" "+r.chains.join(" ")+" "+r.why).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    switch(state.filter){
      case "top": return r.rank <= 25;
      case "nodep": return !r.hasToken;
      case "high": return r.score >= 60 || r.value >= 5e8;
      default: return true;
    }
  }

  function render(){
    var list = rows.filter(passes);
    if(state.sort !== "rank"){
      list.sort(function(a,b){
        var av = a[state.sort], bv = b[state.sort];
        if(typeof av === "string") return av.localeCompare(bv) * state.dir;
        return (av - bv) * state.dir;
      });
    }
    var tb = document.getElementById("rows");
    var maxVal = rows.reduce(function(m,r){ return Math.max(m, r.value); }, 1);
    tb.innerHTML = list.map(function(r){
      var chips = [];
      if(!r.hasToken) chips.push('<span class="chip hot">no token</span>');
      if(r.value >= 1e9) chips.push('<span class="chip warn">≥$1B</span>');
      if(r.score >= 70) chips.push('<span class="chip">hot</span>');
      (r.signals||[]).slice(0,2).forEach(function(s){ chips.push('<span class="chip">'+esc(s)+'</span>'); });
      return '<tr data-slug="'+esc(r.slug)+'">'+
        '<td class="rank">'+r.rank+'</td>'+
        '<td><div class="name">'+esc(r.name)+'</div><div class="cat">'+esc((r.chains||[]).join(" · ")||"")+'</div></td>'+
        '<td class="cat">'+esc(r.category)+'</td>'+
        '<td class="val">'+money(r.value)+'<div class="bar"><i style="width:'+Math.max(4,(r.value/maxVal*100)).toFixed(1)+'%"></i></div></td>'+
        '<td class="score">'+r.score.toFixed(1)+'</td>'+
        '<td><div class="chips">'+chips.join("")+'</div></td>'+
      '</tr>';
    }).join("");
    document.getElementById("empty").style.display = list.length ? "none" : "block";
  }

  function bind(){
    document.getElementById("q").addEventListener("input", function(e){
      state.q = e.target.value.trim(); render();
    });
    document.getElementById("cat").addEventListener("change", function(e){
      state.cat = e.target.value; render();
    });
    document.querySelectorAll("#toggles button").forEach(function(b){
      b.addEventListener("click", function(){
        document.querySelectorAll("#toggles button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        state.filter = b.getAttribute("data-f");
        render();
      });
    });
    document.querySelectorAll("thead th[data-sort]").forEach(function(th){
      th.addEventListener("click", function(){
        var s = th.getAttribute("data-sort");
        if(state.sort === s) state.dir *= -1;
        else { state.sort = s; state.dir = (s === "rank") ? 1 : -1; }
        render();
      });
    });
    document.getElementById("rows").addEventListener("click", function(e){
      var tr = e.target.closest("tr[data-slug]");
      if(tr) openDetail(tr.getAttribute("data-slug"));
    });
    document.getElementById("detail").addEventListener("click", function(e){
      if(e.target.id === "detail" || e.target.classList.contains("close")) closeDetail();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape") closeDetail();
    });
  }

  function openDetail(slug){
    var r = rows.filter(function(x){ return x.slug === slug; })[0];
    if(!r) return;
    var steps = (r.plan && r.plan.length) ? r.plan : [
      "Bridge or deposit into the protocol's core liquidity pools.",
      "Provide liquidity or stake to accrue points / usage weight.",
      "Track governance and snapshot announcements for a token event.",
      "Keep positions active through the launch snapshot window."
    ];
    var card = document.getElementById("card");
    card.innerHTML =
      '<button class="close">✕ close</button>'+
      '<h2>'+esc(r.name)+'</h2>'+
      '<div class="meta">'+esc(r.category)+' · rank #'+r.rank+' · '+esc((r.chains||[]).join(", ")||"multi-chain")+'</div>'+
      '<div class="grid2">'+
        kv("Implied value", money(r.value))+
        kv("Launch score", r.score.toFixed(1))+
        kv("TVL", money(r.tvl))+
        kv("Revenue / fees", money(r.revenue))+
        kv("Volume", money(r.volume))+
        kv("Users", r.users ? r.users.toLocaleString() : "—")+
      '</div>'+
      (r.why ? '<h3>Why it is a launch candidate</h3><div class="why">'+esc(r.why)+'</div>' : "")+
      '<h3>Farm plan</h3><ol class="steps">'+steps.map(function(s){ return "<li>"+esc(s)+"</li>"; }).join("")+'</ol>'+
      ((r.signals&&r.signals.length) ? '<h3>Signals</h3><div class="chips">'+r.signals.map(function(s){ return '<span class="chip">'+esc(s)+'</span>'; }).join("")+'</div>' : "");
    document.getElementById("detail").classList.add("open");
  }
  function kv(k,v){ return '<div class="kv"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }
  function closeDetail(){ document.getElementById("detail").classList.remove("open"); }

  function boot(){
    if(BOARD){ init(); return; }
    fetch("board.json").then(function(r){ return r.json(); }).then(function(b){
      window.__BOARD__ = b; init();
    }).catch(function(){
      document.getElementById("sub").textContent = "board.json not found — embed window.__BOARD__ or serve alongside board.json";
    });
  }
  boot();
})();
</script>
</body>
</html>
