<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
  :root{
    --bg:#0b0f14;--panel:#121821;--panel2:#0f151d;--line:#1f2a37;--txt:#e6edf3;
    --mut:#8b98a9;--acc:#3fb950;--acc2:#58a6ff;--warn:#d29922;--hot:#f85149;--chip:#1b2430;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0b0f14 70%,rgba(11,15,20,.85));border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0;font-size:18px;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:0;min-height:calc(100vh - 64px)}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .left{padding:16px 20px;min-width:0}
  .right{border-left:1px solid var(--line);background:var(--panel2);padding:16px 18px;overflow:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}
  @media(max-width:980px){.right{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  input[type=search],select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
  input[type=search]{flex:1 1 220px}
  select{flex:0 0 auto}
  .stat{color:var(--mut);font-size:12px;margin-left:auto;white-space:nowrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:#12301c;border-color:#2ea043;color:#7ee787}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--bg);text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  thead th:hover{color:var(--txt)}
  tbody td{padding:8px;border-bottom:1px solid #161e28;vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#101822}
  tbody tr.sel{background:#13202e;box-shadow:inset 3px 0 0 var(--acc2)}
  .name{font-weight:600}
  .cat{color:var(--mut);font-size:11px}
  .val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--acc)}
  .rank{color:var(--mut);font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--mut);border:1px solid var(--line);margin-left:6px}
  .tag.hot{color:#ffb3ae;border-color:#5a1d1a;background:#2a1210}
  .tag.warm{color:#f0d38a;border-color:#4a3a12;background:#241d0c}
  .empty{color:var(--mut);padding:24px;text-align:center}
  .detail h2{margin:0 0 4px;font-size:20px}
  .detail .meta{color:var(--mut);font-size:12px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:12px 0}
  .kv .k{color:var(--mut);font-size:12px}
  .kv .v{font-size:13px;word-break:break-word}
  .big{font-size:26px;font-weight:700;color:var(--acc)}
  .section{margin-top:18px}
  .section h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 8px}
  ol.steps{margin:0;padding-left:20px}
  ol.steps li{margin-bottom:8px}
  .bar{height:8px;background:#1a2330;border-radius:6px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2ea043,#58a6ff)}
  .note{color:var(--mut);font-size:12px;margin-top:10px}
  .pill{display:inline-block;background:#12301c;color:#7ee787;border:1px solid #2ea043;border-radius:6px;padding:2px 8px;font-size:11px}
  .pill.no{background:#2a1210;color:#ffb3ae;border-color:#5a1d1a}
  .foot{color:var(--mut);font-size:11px;padding:16px 20px;border-top:1px solid var(--line)}
  a{color:var(--acc2)}
</style>
</head>
<body>
<header>
  <h1>Token Launch <span>Radar</span></h1>
  <div class="sub">Protocols with no token yet, ranked by what a launch would be worth. Offline snapshot.</div>
</header>
<div class="wrap">
  <div class="left">
    <div class="controls">
      <input id="q" type="search" placeholder="Search protocol, category, chain…" autocomplete="off">
      <select id="sort">
        <option value="value">Sort: implied value</option>
        <option value="score">Sort: launch score</option>
        <option value="tvl">Sort: TVL</option>
        <option value="name">Sort: name</option>
      </select>
      <select id="cat"><option value="">All categories</option></select>
      <span class="stat" id="stat"></span>
    </div>
    <div class="chips" id="chips"></div>
    <table>
      <thead>
        <tr>
          <th data-k="rank">#</th>
          <th data-k="name">Protocol</th>
          <th data-k="cat">Category</th>
          <th data-k="tvl">TVL</th>
          <th data-k="value">Implied value</th>
          <th data-k="score">Score</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No protocols match this filter.</div>
  </div>
  <div class="right detail" id="detail">
    <div class="empty">Select a protocol to see its launch case and farm plan.</div>
  </div>
</div>
<div class="foot" id="foot"></div>

<script>
(function(){
  "use strict";
  var DATA = window.RADAR_DATA || {generated:null, rows:[]};
  var rows = (DATA.rows || []).slice();
  var state = {q:"", sort:"value", cat:"", chips:{hot:false, warm:false, fresh:false}, sel:null};

  function fmtUsd(n){
    if(n==null||isNaN(n)) return "—";
    var a=Math.abs(n), s=n<0?"-":"";
    if(a>=1e9) return s+"$"+(a/1e9).toFixed(2)+"B";
    if(a>=1e6) return s+"$"+(a/1e6).toFixed(2)+"M";
    if(a>=1e3) return s+"$"+(a/1e3).toFixed(1)+"K";
    return s+"$"+a.toFixed(0);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function heat(r){
    var s = r.score==null?0:r.score;
    if(s>=75) return "hot";
    if(s>=50) return "warm";
    return "";
  }
  function matches(r){
    if(state.cat && r.category!==state.cat) return false;
    var h=heat(r);
    if(state.chips.hot && h!=="hot") return false;
    if(state.chips.warm && h!=="warm") return false;
    if(state.chips.fresh && !(r.daysSinceLaunch==null||r.daysSinceLaunch<=90)) return false;
    if(state.q){
      var q=state.q.toLowerCase();
      var hay=[r.name,r.category,r.chains&&r.chains.join(" "),r.description,r.reason].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }
  function sortRows(list){
    var k=state.sort;
    list.sort(function(a,b){
      if(k==="name") return String(a.name).localeCompare(String(b.name));
      if(k==="tvl") return (b.tvl||0)-(a.tvl||0);
      if(k==="score") return (b.score||0)-(a.score||0);
      return (b.impliedValue||0)-(a.impliedValue||0);
    });
    return list;
  }
  function renderChips(){
    var el=document.getElementById("chips");
    el.innerHTML="";
    var defs=[["hot","🔥 Hot (score ≥ 75)"],["warm","Warm (50–74)"],["fresh","New (≤ 90d)"]];
    defs.forEach(function(d){
      var b=document.createElement("span");
      b.className="chip"+(state.chips[d[0]]?" on":"");
      b.textContent=d[1];
      b.onclick=function(){state.chips[d[0]]=!state.chips[d[0]];render();};
      el.appendChild(b);
    });
  }
  function renderCats(){
    var sel=document.getElementById("cat");
    var cats={};
    rows.forEach(function(r){if(r.category)cats[r.category]=1;});
    var keys=Object.keys(cats).sort();
    sel.innerHTML='<option value="">All categories</option>';
    keys.forEach(function(c){
      var o=document.createElement("option");
      o.value=c;o.textContent=c;
      sel.appendChild(o);
    });
  }
  function render(){
    renderChips();
    var list=sortRows(rows.filter(matches));
    var tb=document.getElementById("rows");
    tb.innerHTML="";
    list.forEach(function(r){
      var tr=document.createElement("tr");
      if(state.sel===r.id) tr.className="sel";
      var h=heat(r);
      tr.innerHTML=
        '<td class="rank">'+esc(r.rank)+'</td>'+
        '<td><div class="name">'+esc(r.name)+(h?'<span class="tag '+h+'">'+esc(h)+'</span>':'')+'</div>'+
          '<div class="cat">'+esc((r.chains||[]).join(" · "))+'</div></td>'+
        '<td>'+esc(r.category||"—")+'</td>'+
        '<td>'+fmtUsd(r.tvl)+'</td>'+
        '<td class="val">'+fmtUsd(r.impliedValue)+'</td>'+
        '<td>'+esc(r.score==null?"—":r.score)+'</td>';
      tr.onclick=function(){state.sel=r.id;render();showDetail(r);};
      tb.appendChild(tr);
    });
    document.getElementById("empty").style.display=list.length?"none":"block";
    document.getElementById("stat").textContent=list.length+" of "+rows.length+" protocols";
    var total=list.reduce(function(a,r){return a+(r.impliedValue||0);},0);
    document.getElementById("foot").textContent=
      "Snapshot "+(DATA.generated||"unknown")+" · "+rows.length+" tokenless protocols · filtered implied value "+fmtUsd(total)+" · generated by main.ts";
  }
  function showDetail(r){
    var el=document.getElementById("detail");
    var steps=(r.farmPlan||[]).map(function(s){return "<li>"+esc(s)+"</li>";}).join("");
    var score=r.score==null?0:r.score;
    var conf=r.confidence==null?null:Math.round(r.confidence*100);
    el.innerHTML=
      '<h2>'+esc(r.name)+'</h2>'+
      '<div class="meta">'+esc(r.category||"Uncategorized")+' · '+(r.chains||[]).join(", ")+' · rank #'+esc(r.rank)+'</div>'+
      '<div class="big">'+fmtUsd(r.impliedValue)+'</div>'+
      '<div class="note">Implied launch value (FDV proxy from TVL, revenue and comparables)</div>'+
      '<div class="kv">'+
        '<div class="k">TVL</div><div class="v">'+fmtUsd(r.tvl)+'</div>'+
        '<div class="k">Launch score</div><div class="v">'+score+'/100'+(conf!=null?' · confidence '+conf+'%':'')+'</div>'+
        '<div class="k">Token status</div><div class="v"><span class="pill no">No token</span></div>'+
        '<div class="k">Wrapped/staked?</div><div class="v">'+(r.isWrappedOrStaked?'<span class="pill no">Yes — excluded</span>':'<span class="pill">No</span>')+'</div>'+
        '<div class="k">Days since launch</div><div class="v">'+(r.daysSinceLaunch==null?"—":esc(r.daysSinceLaunch))+'</div>'+
        '<div class="k">Revenue (30d)</div><div class="v">'+fmtUsd(r.revenue30d)+'</div>'+
      '</div>'+
      '<div class="section"><h3>Why it ranks here</h3><div>'+esc(r.reason||r.description||"")+'</div>'+
        '<div class="bar"><i style="width:'+Math.max(2,Math.min(100,score))+'%"></i></div></div>'+
      '<div class="section"><h3>Farm plan</h3><ol class="steps">'+(steps||"<li>No plan recorded.</li>")+'</ol></div>'+
      '<div class="note">This is research, not financial advice. Verify contracts before interacting.</div>';
  }
  document.getElementById("q").oninput=function(e){state.q=e.target.value;render();};
  document.getElementById("sort").onchange=function(e){state.sort=e.target.value;render();};
  document.getElementById("cat").onchange=function(e){state.cat=e.target.value;render();};
  renderCats();
  render();
  if(rows.length){state.sel=rows[0].id;showDetail(rows[0]);render();}
})();
</script>
</body>
</html>
