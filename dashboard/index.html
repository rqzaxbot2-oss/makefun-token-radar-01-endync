<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
  :root{
    --bg:#0b0f14;--panel:#121821;--panel2:#0f141c;--line:#1f2a37;--line2:#2a3a4d;
    --txt:#dbe4ee;--dim:#8b9bb0;--dim2:#5f7186;--acc:#39d98a;--acc2:#3aa0ff;
    --hot:#ff5c7a;--warm:#ffb347;--cool:#7aa2ff;--chip:#182231;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  a{color:var(--acc2);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0f14 70%,rgba(11,15,20,.85));border-bottom:1px solid var(--line);padding:12px 18px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:18px;margin:0;letter-spacing:.5px}
  .brand .sub{color:var(--dim);font-size:12px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
  .stats b{color:var(--txt)}
  .wrap{display:grid;grid-template-columns:1fr;gap:0}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:10}
  .controls input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:8px 10px;border-radius:6px;font:inherit}
  .controls select{background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:8px;border-radius:6px;font:inherit}
  .controls label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
  .btn{background:var(--chip);border:1px solid var(--line2);color:var(--txt);padding:7px 10px;border-radius:6px;cursor:pointer;font:inherit}
  .btn:hover{border-color:var(--acc2)}
  .btn.on{background:#123;border-color:var(--acc2);color:#cfe6ff}
  main{padding:0 18px 60px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--bg);text-align:left;color:var(--dim);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
  thead th:hover{color:var(--txt)}
  thead th .ar{color:var(--acc);font-size:10px}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#0f1620}
  .rank{color:var(--dim2);width:38px}
  .name{font-weight:600;color:var(--txt)}
  .cat{color:var(--dim);font-size:11px}
  .val{color:var(--acc);font-weight:600;white-space:nowrap}
  .score{font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#1a2430;border-radius:3px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:var(--chip);color:var(--dim);border:1px solid var(--line2);margin-right:4px;white-space:nowrap}
  .tier{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;letter-spacing:.4px}
  .t-hot{background:#3a1220;color:var(--hot);border:1px solid #5a1d30}
  .t-warm{background:#3a2a10;color:var(--warm);border:1px solid #5a4218}
  .t-cool{background:#12203a;color:var(--cool);border:1px solid #1d335a}
  .muted{color:var(--dim2)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  /* detail */
  .detail{padding:18px 0;max-width:1100px}
  .back{display:inline-block;margin-bottom:14px;color:var(--dim)}
  .dhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px}
  .dhead h2{margin:0 0 4px;font-size:22px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
  .kv .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .kv .box .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .kv .box .v{font-size:16px;margin-top:3px;color:var(--txt)}
  .section{margin-top:22px}
  .section h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0 0 10px;border-left:3px solid var(--acc2);padding-left:8px}
  ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 46px;margin-bottom:8px;position:relative}
  ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--chip);border:1px solid var(--line2);color:var(--acc);text-align:center;line-height:20px;font-size:12px;font-weight:700}
  .why{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--dim);line-height:1.6}
  .why b{color:var(--txt)}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--chip);border:1px solid var(--line2);font-size:11px;color:var(--dim);margin:0 4px 4px 0}
  .foot{color:var(--dim2);font-size:11px;padding:20px 18px;border-top:1px solid var(--line);margin-top:30px}
  .hide{display:none!important}
  @media(max-width:720px){.col-hide{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>◈ TOKEN LAUNCH RADAR</h1>
    <span class="sub">protocols with no token yet · ranked by what a launch would be worth</span>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="boardView">
  <div class="controls">
    <input id="q" type="search" placeholder="Search protocol, category, chain…" autocomplete="off">
    <select id="cat"><option value="">All categories</option></select>
    <select id="tier">
      <option value="">All tiers</option>
      <option value="hot">Hot</option>
      <option value="warm">Warm</option>
      <option value="cool">Cool</option>
    </select>
    <label><input type="checkbox" id="hasFarm"> farm plan only</label>
    <button class="btn" id="reset">Reset</button>
    <span class="muted" id="count"></span>
  </div>
  <main>
    <table>
      <thead>
        <tr>
          <th data-sort="rank">#</th>
          <th data-sort="name">Protocol</th>
          <th data-sort="category" class="col-hide">Category</th>
          <th data-sort="impliedValue">Implied value <span class="ar" id="ar-impliedValue"></span></th>
          <th data-sort="score" class="col-hide">Score <span class="ar" id="ar-score"></span></th>
          <th data-sort="tier">Tier</th>
          <th class="col-hide">Farm</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty">No protocols match these filters.</div>
  </main>
</div>

<div id="detailView" class="hide">
  <main>
    <div class="detail" id="detail"></div>
  </main>
</div>

<div class="foot">
  Offline snapshot · data inlined · no network calls · click any row for the detail view and farm plan.
</div>

<script>
const DATA = window.__BOARD__ || {generatedAt:null, rows:[]};
const ROWS = (DATA.rows||[]).slice();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtUSD(n){
  if(n==null||isNaN(n)) return "—";
  const a=Math.abs(n);
  if(a>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(a>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(a>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
  return "$"+Math.round(n);
}
function tierOf(r){
  const t=(r.tier||"").toLowerCase();
  if(t==="hot"||t==="warm"||t==="cool") return t;
  const s=Number(r.score)||0;
  return s>=70?"hot":s>=40?"warm":"cool";
}
const TIER_LABEL={hot:"HOT",warm:"WARM",cool:"COOL"};

/* ---------- stats ---------- */
function renderStats(){
  const n=ROWS.length;
  const total=ROWS.reduce((a,r)=>a+(Number(r.impliedValue)||0),0);
  const hot=ROWS.filter(r=>tierOf(r)==="hot").length;
  const withFarm=ROWS.filter(r=>r.farmPlan&&(Array.isArray(r.farmPlan)?r.farmPlan.length:r.farmPlan)).length;
  const gen=DATA.generatedAt?new Date(DATA.generatedAt).toISOString().slice(0,16).replace("T"," ")+" UTC":"—";
  $("#stats").innerHTML =
    `<span><b>${n}</b> protocols</span>`+
    `<span><b>${hot}</b> hot</span>`+
    `<span><b>${withFarm}</b> with farm plan</span>`+
    `<span>pooled implied value <b>${fmtUSD(total)}</b></span>`+
    `<span>snapshot <b>${esc(gen)}</b></span>`;
}

/* ---------- filters ---------- */
const state={q:"",cat:"",tier:"",hasFarm:false,sort:"rank",dir:1};

function categories(){
  const set=new Set();
  ROWS.forEach(r=>{if(r.category)set.add(r.category)});
  return [...set].sort();
}
function fillCats(){
  const sel=$("#cat");
  categories().forEach(c=>{
    const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);
  });
}
function matches(r){
  if(state.cat && r.category!==state.cat) return false;
  if(state.tier && tierOf(r)!==state.tier) return false;
  if(state.hasFarm){
    const fp=r.farmPlan;
    const ok=Array.isArray(fp)?fp.length>0:!!fp;
    if(!ok) return false;
  }
  if(state.q){
    const hay=(r.name+" "+(r.category||"")+" "+(r.chains||[]).join(" ")+" "+(r.description||"")).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function sortRows(rows){
  const k=state.sort, d=state.dir;
  return rows.slice().sort((a,b)=>{
    let av=a[k],bv=b[k];
    if(k==="rank"){av=Number(a.rank)||1e9;bv=Number(b.rank)||1e9;}
    else if(k==="impliedValue"||k==="score"){av=Number(av)||0;bv=Number(bv)||0;}
    else if(k==="tier"){const o={hot:0,warm:1,cool:2};av=o[tierOf(a)];bv=o[tierOf(b)];}
    else{av=String(av||"").toLowerCase();bv=String(bv||"").toLowerCase();}
    if(av<bv)return -1*d; if(av>bv)return 1*d; return 0;
  });
}

/* ---------- board ---------- */
function renderBoard(){
  const filtered=sortRows(ROWS.filter(matches));
  const maxV=Math.max(1,...ROWS.map(r=>Number(r.impliedValue)||0));
  const tb=$("#rows");
  tb.innerHTML=filtered.map(r=>{
    const t=tierOf(r);
    const v=Number(r.impliedValue)||0;
    const pct=Math.max(2,Math.round(v/maxV*100));
    const fp=r.farmPlan;
    const hasFarm=Array.isArray(fp)?fp.length>0:!!fp;
    return `<tr data-id="${esc(r.id||r.slug||r.name)}">
      <td class="rank">${esc(r.rank!=null?r.rank:"—")}</td>
      <td><div class="name">${esc(r.name)}</div>
        <div class="cat">${esc((r.chains||[]).slice(0,3).join(" · ")||"")}</div></td>
      <td class="col-hide"><span class="chip">${esc(r.category||"—")}</span></td>
      <td><span class="val">${fmtUSD(v)}</span>
        <div class="bar" style="margin-top:5px"><i style="width:${pct}%"></i></div></td>
      <td class="col-hide score">${(Number(r.score)||0).toFixed(1)}</td>
      <td><span class="tier t-${t}">${TIER_LABEL[t]}</span></td>
      <td class="col-hide">${hasFarm?'<span class="chip" style="color:var(--acc);border-color:#1d4a33">plan ✓</span>':'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join("");
  $("#empty").classList.toggle("hide",filtered.length>0);
  $("#count").textContent=`${filtered.length} / ${ROWS.length} shown`;
  tb.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click",()=>openDetail(tr.getAttribute("data-id")));
  });
}

/* ---------- detail ---------- */
function findRow(id){
  return ROWS.find(r=>String(r.id||r.slug||r.name)===String(id));
}
function stepsOf(r){
  const fp=r.farmPlan;
  if(Array.isArray(fp)) return fp.map(s=>typeof s==="string"?s:(s.step||s.text||JSON.stringify(s)));
  if(fp&&typeof fp==="object"){
    if(Array.isArray(fp.steps)) return fp.steps.map(s=>typeof s==="string"?s:(s.step||s.text||JSON.stringify(s)));
    return Object.values(fp).map(String);
  }
  if(typeof fp==="string"&&fp.trim()) return [fp];
  return [];
}
function openDetail(id){
  const r=findRow(id);
  if(!r) return;
  const t=tierOf(r);
  const steps=stepsOf(r);
  const chains=(r.chains||[]);
  const why=r.why||r.rationale||r.description||"";
  const score=Number(r.score)||0;
  const v=Number(r.impliedValue)||0;
  const el=$("#detail");
  el.innerHTML=`
    <a class="back" href="#" id="backLink">← back to board</a>
    <div class="dhead">
      <div>
        <h2>${esc(r.name)}</h2>
        <div class="muted">${esc(r.category||"uncategorized")}${chains.length?" · "+esc(chains.join(", ")):""}</div>
      </div>
      <div style="text-align:right">
        <div class="val" style="font-size:24px">${fmtUSD(v)}</div>
        <div><span class="tier t-${t}">${TIER_LABEL[t]}</span> <span class="muted">rank #${esc(r.rank!=null?r.rank:"—")}</span></div>
      </div>
    </div>
    <div class="kv">
      <div class="box"><div class="k">Implied value</div><div class="v" style="color:var(--acc)">${fmtUSD(v)}</div></div>
      <div class="box"><div class="k">Launch score</div><div class="v">${score.toFixed(1)}</div></div>
      <div class="box"><div class="k">Tier</div><div class="v">${TIER_LABEL[t]}</div></div>
      <div class="box"><div class="k">Token status</div><div class="v" style="font-size:13px">${esc(r.tokenStatus||"no token")}</div></div>
      <div class="box"><div class="k">Chains</div><div class="v" style="font-size:13px">${esc(chains.join(", ")||"—")}</div></div>
      <div class="box"><div class="k">TVL</div><div class="v" style="font-size:13px">${fmtUSD(Number(r.tvl)||0)}</div></div>
    </div>
    ${why?`<div class="section"><h3>Why it ranks here</h3><div class="why">${esc(why)}</div></div>`:""}
    <div class="section"><h3>Farm plan · steps to farm it</h3>
      ${steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`
        :`<div class="why muted">No farm plan recorded for this protocol.</div>`}
    </div>
    ${r.tags&&r.tags.length?`<div class="section"><h3>Tags</h3><div>${r.tags.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div>`:""}
    ${r.url?`<div class="section"><h3>Links</h3><div class="muted">${esc(r.url)}</div></div>`:""}
  `;
  $("#boardView").classList.add("hide");
  $("#detailView").classList.remove("hide");
  window.scrollTo(0,0);
  $("#backLink").addEventListener("click",e=>{e.preventDefault();closeDetail();});
  if(location.hash!=="#p="+encodeURIComponent(id)) history.replaceState(null,"","#p="+encodeURIComponent(id));
}
function closeDetail(){
  $("#detailView").classList.add("hide");
  $("#boardView").classList.remove("hide");
