<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#182231;--line:#243044;--txt:#e6edf6;--dim:#8b9bb4;--acc:#3ddc97;--acc2:#5aa9ff;--warn:#ffb454;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:linear-gradient(180deg,#101722,#0b0f14)}
h1{font-size:19px;margin:0;letter-spacing:.3px}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12px}
.spacer{flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--dim)}
.stat b{color:var(--txt);font-size:14px;display:block}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;height:calc(100vh - 74px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
.left{overflow:auto;padding:14px 16px}
.right{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--panel)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px}
input[type=search]{min-width:220px}
input[type=range]{padding:0;accent-color:var(--acc)}
label.f{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--bg);text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--txt)}
td{padding:8px;border-bottom:1px solid #1a2331;vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover{background:#141c28}
tr.row.sel{background:#16263a;box-shadow:inset 3px 0 0 var(--acc)}
.rank{color:var(--dim);font-variant-numeric:tabular-nums;width:34px}
.name{font-weight:600}
.cat{color:var(--dim);font-size:11px}
.val{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600;white-space:nowrap}
.score{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;background:#1d2838;border-radius:3px;overflow:hidden;margin-top:4px;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--dim);margin:1px 3px 1px 0}
.tag.hi{color:var(--acc);border-color:#1f5c43}
.tag.mid{color:var(--warn);border-color:#5c4a1f}
.tag.lo{color:var(--bad);border-color:#5c2323}
.empty{color:var(--dim);padding:30px;text-align:center}
.detail h2{margin:0 0 2px;font-size:20px}
.detail .meta{color:var(--dim);font-size:12px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px}
.kv div:nth-child(odd){color:var(--dim)}
.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:0 0 8px}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:8px}
ol.steps li b{color:var(--acc2)}
.why{color:var(--dim);font-size:12px;margin-top:4px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;margin:0 6px 6px 0}
.big{font-size:26px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}
a{color:var(--acc2)}
.close{float:right;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 8px;cursor:pointer}
.close:hover{color:var(--txt)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Token Launch <span>Radar</span></h1>
    <div class="sub">Protocols DefiLlama tracks that still have no token &middot; ranked by what a launch would be worth</div>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="left">
    <div class="filters">
      <input type="search" id="q" placeholder="Search protocol, chain, category…">
      <select id="cat"><option value="">All categories</option></select>
      <select id="chain"><option value="">All chains</option></select>
      <select id="sort">
        <option value="value">Sort: implied value</option>
        <option value="score">Sort: launch score</option>
        <option value="tvl">Sort: TVL</option>
        <option value="name">Sort: name</option>
      </select>
      <label class="f">Min score <input type="range" id="minScore" min="0" max="100" value="0" step="5"><span id="minScoreV">0</span></label>
      <label class="f"><input type="checkbox" id="hideWrapped" checked> Exclude wrapped/staked</label>
      <button class="close" id="reset" style="float:none">Reset</button>
    </div>
    <div id="count" class="sub" style="margin-bottom:8px"></div>
    <table>
      <thead><tr>
        <th data-k="rank">#</th>
        <th data-k="name">Protocol</th>
        <th data-k="tvl">TVL</th>
        <th data-k="value">Implied value</th>
        <th data-k="score">Launch score</th>
        <th data-k="chains">Chains</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No protocols match these filters.</div>
  </section>
  <aside class="right" id="detail">
    <div class="empty">Select a protocol to see its launch case and farm plan.</div>
  </aside>
</main>
<script>
(function(){
"use strict";
var BOARD = window.__BOARD__ || null;
var rows = [], byId = {}, selected = null;

function fmtUsd(n){
  if(n==null||isNaN(n)) return "—";
  var a=Math.abs(n);
  if(a>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(a>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(a>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
  return "$"+Math.round(n);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function scoreClass(s){return s>=70?"hi":s>=45?"mid":"lo";}

function normalize(raw){
  var list = Array.isArray(raw)?raw:(raw&&Array.isArray(raw.protocols)?raw.protocols:(raw&&Array.isArray(raw.board)?raw.board:[]));
  return list.map(function(p,i){
    var tvl = num(p.tvl!=null?p.tvl:p.tvlUsd);
    var value = num(p.impliedValue!=null?p.impliedValue:(p.value!=null?p.value:p.implied_value));
    var score = num(p.launchScore!=null?p.launchScore:(p.score!=null?p.score:p.launch_score));
    var chains = p.chains||p.chainsList||(p.chain?[p.chain]:[]);
    if(typeof chains==="string") chains=chains.split(/[,;]\s*/);
    return {
      id: p.id||p.slug||p.name||("p"+i),
      name: p.name||p.protocol||p.id||("Protocol "+i),
      category: p.category||p.cat||"Uncategorized",
      chains: chains.filter(Boolean),
      tvl: tvl,
      value: value,
      score: score,
      wrapped: !!(p.wrapped||p.isWrapped||p.staked||p.isStaked||p.wrappedOrStaked),
      why: p.why||p.rationale||p.reason||"",
      farm: p.farm||p.farmPlan||p.plan||[],
      url: p.url||p.defillama||"",
      mcap: num(p.mcap||p.marketCap||p.fdv),
      volume: num(p.volume||p.volume24h),
      fees: num(p.fees||p.fees24h),
      raw: p
    };
  });
}
function num(v){ if(v==null) return null; if(typeof v==="number") return isFinite(v)?v:null; var n=parseFloat(String(v).replace(/[$,]/g,"")); return isFinite(n)?n:null; }

function farmSteps(p){
  var f = p.farm;
  if(Array.isArray(f) && f.length){
    return f.map(function(s){
      if(typeof s==="string") return {title:s,detail:""};
      return {title:s.title||s.step||s.action||"Step", detail:s.detail||s.desc||s.description||""};
    });
  }
  // Derive a sensible farm plan from the protocol's own data.
  var steps=[];
  steps.push({title:"Bridge or fund on "+(p.chains[0]||"its main chain"), detail:"Keep gas and a stable buffer ready; the protocol lives on "+(p.chains.join(", ")||"one chain")+"."});
  if(p.tvl!=null) steps.push({title:"Provide liquidity where TVL is deepest", detail:"TVL is "+fmtUsd(p.tvl)+"; LP in the deepest pool to earn points and stay liquid."});
  steps.push({title:"Check for a points or season program", detail:"Most pre-token protocols run points seasons before launch; farm early and often."});
  steps.push({title:"Track governance and snapshot signals", detail:"A token usually follows a governance forum post or a snapshot vote; watch the protocol's announcements."});
  steps.push({title:"Size the position to the implied value", detail:"Implied launch value is "+fmtUsd(p.value)+"; keep exposure proportional to that upside."});
  return steps;
}

function renderStats(){
  var total = rows.length;
  var sumVal = rows.reduce(function(a,r){return a+(r.value||0);},0);
  var avg = total?sumVal/total:0;
  var top = rows.slice().sort(function(a,b){return (b.score||0)-(a.score||0);})[0];
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+total+'</b>protocols</div>'+
    '<div class="stat"><b>'+fmtUsd(sumVal)+'</b>total implied value</div>'+
    '<div class="stat"><b>'+fmtUsd(avg)+'</b>avg implied value</div>'+
    '<div class="stat"><b>'+esc(top?top.name:"—")+'</b>top score</div>';
}

function fillSelect(id, values){
  var sel=document.getElementById(id);
  values.sort().forEach(function(v){
    var o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}

function currentFilters(){
  return {
    q: document.getElementById("q").value.trim().toLowerCase(),
    cat: document.getElementById("cat").value,
    chain: document.getElementById("chain").value,
    sort: document.getElementById("sort").value,
    minScore: parseInt(document.getElementById("minScore").value,10)||0,
    hideWrapped: document.getElementById("hideWrapped").checked
  };
}

function applyFilters(){
  var f=currentFilters();
  var out = rows.filter(function(r){
    if(f.hideWrapped && r.wrapped) return false;
    if(f.cat && r.category!==f.cat) return false;
    if(f.chain && r.chains.indexOf(f.chain)<0) return false;
    if((r.score||0) < f.minScore) return false;
    if(f.q){
      var hay=(r.name+" "+r.category+" "+r.chains.join(" ")).toLowerCase();
      if(hay.indexOf(f.q)<0) return false;
    }
    return true;
  });
  out.sort(function(a,b){
    if(f.sort==="name") return a.name.localeCompare(b.name);
    if(f.sort==="tvl") return (b.tvl||0)-(a.tvl||0);
    if(f.sort==="score") return (b.score||0)-(a.score||0);
    return (b.value||0)-(a.value||0);
  });
  return out;
}

function renderTable(){
  var list=applyFilters();
  var tb=document.getElementById("rows");
  var maxVal = list.reduce(function(m,r){return Math.max(m,r.value||0);},0)||1;
  tb.innerHTML = list.map(function(r,i){
    var pct = Math.round(((r.value||0)/maxVal)*100);
    var cls = scoreClass(r.score||0);
    return '<tr class="row'+(selected===r.id?' sel':'')+'" data-id="'+esc(r.id)+'">'+
      '<td class="rank">'+(i+1)+'</td>'+
      '<td><div class="name">'+esc(r.name)+'</div><div class="cat">'+esc(r.category)+'</div></td>'+
      '<td class="score">'+fmtUsd(r.tvl)+'</td>'+
      '<td><div class="val">'+fmtUsd(r.value)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></td>'+
      '<td><span class="tag '+cls+'">'+(r.score!=null?Math.round(r.score):"—")+'</span></td>'+
      '<td class="cat">'+esc(r.chains.slice(0,3).join(", "))+(r.chains.length>3?" +"+(r.chains.length-3):"")+'</td>'+
    '</tr>';
  }).join("");
  document.getElementById("count").textContent = "Showing "+list.length+" of "+rows.length+" protocols";
  document.getElementById("empty").style.display = list.length?"none":"block";
  Array.prototype.forEach.call(tb.querySelectorAll("tr.row"),function(tr){
    tr.addEventListener("click",function(){ select(tr.getAttribute("data-id")); });
  });
}

function renderDetail(r){
  var el=document.getElementById("detail");
  if(!r){ el.innerHTML='<div class="empty">Select a protocol to see its launch case and farm plan.</div>'; return; }
  var steps=farmSteps(r);
  var tags = r.chains.map(function(c){return '<span class="pill">'+esc(c)+'</span>';}).join("");
  var why = r.why ? '<div class="section"><h3>Why it would be worth a launch</h3><div>'+esc(r.why)+'</div></div>' : "";
  var links = r.url ? '<div class="section"><h3>Source</h3><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a></div>' : "";
  el.innerHTML =
    '<div class="detail">'+
      '<button class="close" id="closeDetail">Close</button>'+
      '<h2>'+esc(r.name)+'</h2>'+
      '<div class="meta">'+esc(r.category)+(r.wrapped?' &middot; wrapped/staked product':' &middot; no token yet')+'</div>'+
      '<div class="big">'+fmtUsd(r.value)+'</div>'+
      '<div class="sub" style="margin-bottom:12px">implied launch value</div>'+
      '<div class="kv">'+
        '<div>Launch score</div><div><span class="tag '+scoreClass(r.score||0)+'">'+(r.score!=null?Math.round(r.score):"—")+' / 100</span></div>'+
        '<div>TVL</div><div>'+fmtUsd(r.tvl)+'</div>'+
        (r.mcap!=null?'<div>Market cap / FDV</div><div>'+fmtUsd(r.mcap)+'</div>':'')+
        (r.volume!=null?'<div>24h volume</div><div>'+fmtUsd(r.volume)+'</div>':'')+
        (r.fees!=null?'<div>24h fees</div><div>'+fmtUsd(r.fees)+'</div>':'')+
        '<div>Chains</div><div>'+esc(r.chains.join(", ")||"—")+'</div>'+
      '</div>'+
      (tags?'<div class="section"><h3>Where it lives</h3>'+tags+'</div>':'')+
      why+
      '<div class="section"><h3>How to farm it</h3><ol class="steps">'+
        steps.map(function(s){
          return '<li><b>'+esc(s.title)+'</b>'+(s.detail?'<div class="why">'+esc(s.detail)+'</div>':'')+'</li>';
        }).join("")+
      '</ol></div>'+
      links+
    '</div>';
  document.getElementById("closeDetail").addEventListener("click",function(){ select(null); });
}

function select(id){
  selected = id;
  renderTable();
  renderDetail(id?byId[id]:null);
  if(id){
    var tr=document.querySelector('tr.row[data-id="'+CSS.escape(id)+'"]');
    if(tr && tr.scrollIntoView) tr.scrollIntoView({block:"nearest"});
  }
}

function boot(){
  if(!BOARD){
    document.getElementById("rows").innerHTML='<tr><td colspan="6" class="empty">No board data loaded. Run main.ts to generate board.json and inject it here.</td></tr>';
    return;
  }
  rows = normalize(BOARD);
  rows.forEach(function(r){ byId[r.id]=r; });
  var cats={}, chains={};
  rows.forEach(function(r){ cats[r.category]=1; r.chains.forEach(function(c){chains[c]=1;}); });
  fillSelect("cat",Object.keys(cats));
  fillSelect("chain",Object.keys(chains));
  renderStats();
  renderTable();
  ["q","cat","chain","sort","minScore","hideWrapped"].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener("input",function(){
      if(id==="minScore") document.getElementById("minScoreV").textContent=el.value;
      renderTable();
    });
    el.addEventListener("change",renderTable);
  });
  document.getElementById("reset").addEventListener("click",function(){
    document.getElementById("q").value="";
    document.getElementById("cat").value="";
    document.getElementById("chain").value="";
    document.getElementById("sort").value="value";
    document.getElementById("minScore").value="0";
    document.getElementById("minScoreV").textContent="0";
    document.getElementById("hideWrapped").checked=true;
    renderTable();
  });
  Array.prototype.forEach.call(document.querySelectorAll("th[
