<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
:root{
  --bg:#0b0f14;--panel:#121821;--panel2:#0f141c;--line:#1e2733;--line2:#2a3646;
  --txt:#e6edf5;--dim:#8b9bb0;--dim2:#5f7086;--acc:#4fd1a5;--acc2:#7aa2ff;
  --hot:#ff7a59;--warm:#ffc857;--cool:#5f7086;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0f14 70%,rgba(11,15,20,.85));border-bottom:1px solid var(--line);padding:14px 22px 12px}
.hrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:.2px}
h1 .dot{color:var(--acc)}
.sub{color:var(--dim);font-size:12.5px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--dim)}
.kpi b{color:var(--txt);font-family:var(--mono);font-size:13px;margin-left:6px}
main{padding:16px 22px 60px;max-width:1500px;margin:0 auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],select{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:7px 10px;font-size:13px;outline:none}
input[type=search]{min-width:260px}
input[type=search]:focus,select:focus{border-color:var(--acc)}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--dim);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--acc);color:var(--txt)}
.chip.on{background:rgba(79,209,165,.12);border-color:var(--acc);color:var(--acc)}
.chip .n{color:var(--dim2);margin-left:5px;font-family:var(--mono);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--bg);text-align:left;color:var(--dim2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap}
thead th:hover{color:var(--txt)}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody td{padding:9px 10px;vertical-align:top}
.rank{font-family:var(--mono);color:var(--dim2);width:44px}
.name{font-weight:600;color:var(--txt)}
.cat{color:var(--dim);font-size:12px}
.val{font-family:var(--mono);color:var(--acc);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:70px;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tier{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.t-hot{background:rgba(255,122,89,.15);color:var(--hot)}
.t-warm{background:rgba(255,200,87,.14);color:var(--warm)}
.t-cool{background:rgba(95,112,134,.18);color:var(--dim)}
.mono{font-family:var(--mono)}
.muted{color:var(--dim2)}
.hide{display:none!important}
#detail{padding:4px 0}
.back{display:inline-block;margin-bottom:14px;font-size:13px}
.dhead{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px 20px}
.dhead h2{margin:0 0 4px;font-size:22px}
.dhead .meta{color:var(--dim);font-size:12.5px}
.dstats{display:flex;gap:22px;flex-wrap:wrap}
.dstat{min-width:96px}
.dstat .l{color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.dstat .v{font-family:var(--mono);font-size:18px;color:var(--txt)}
.dstat .v.acc{color:var(--acc)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
.factor{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.factor:last-child{border-bottom:0}
.factor .k{color:var(--dim)}
.factor .v{font-family:var(--mono);color:var(--txt)}
.factor .v.pos{color:var(--acc)}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin:0 0 11px;padding-left:2px}
ol.steps li b{color:var(--txt)}
ol.steps li .why{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:2px 8px;font-size:11.5px;margin:0 6px 6px 0}
.note{color:var(--dim);font-size:12.5px;margin-top:12px;border-left:2px solid var(--line2);padding-left:10px}
.empty{color:var(--dim);padding:40px;text-align:center}
footer{color:var(--dim2);font-size:12px;padding:0 22px 30px;max-width:1500px;margin:0 auto}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Token Launch Radar<span class="dot">.</span></h1>
    <span class="sub">Protocols with no token yet, ranked by what a launch would be worth</span>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <section id="board">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search protocol, category, chain…" autocomplete="off">
      <select id="cat"><option value="">All categories</option></select>
      <select id="chain"><option value="">All chains</option></select>
      <select id="sort">
        <option value="value">Sort: implied value</option>
        <option value="tvl">Sort: TVL</option>
        <option value="fees">Sort: fees</option>
        <option value="name">Sort: name</option>
      </select>
      <span class="chip on" data-tier="all">All <span class="n" id="c-all"></span></span>
      <span class="chip" data-tier="hot">Hot <span class="n" id="c-hot"></span></span>
      <span class="chip" data-tier="warm">Warm <span class="n" id="c-warm"></span></span>
      <span class="chip" data-tier="cool">Watch <span class="n" id="c-cool"></span></span>
    </div>
    <table>
      <thead><tr>
        <th class="rank">#</th><th>Protocol</th><th>Category</th><th>Chains</th>
        <th>TVL</th><th>Fees 30d</th><th>Implied value</th><th>Tier</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="nores">No protocols match these filters.</div>
  </section>
  <section id="detail" class="hide"></section>
</main>
<footer id="foot"></footer>

<script>
"use strict";
const DATA = window.RADAR_DATA || {rows:[],generated_at:"",source:""};
const ROWS = Array.isArray(DATA.rows) ? DATA.rows.slice() : [];
const MAXV = ROWS.reduce((m,r)=>Math.max(m, num(r.implied_value_usd)), 0) || 1;

function num(x){const n=Number(x);return Number.isFinite(n)?n:0;}
function usd(x){
  const n=num(x);
  if(n>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6) return "$"+(n/1e6).toFixed(n>=1e8?1:2)+"M";
  if(n>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
  if(n>0) return "$"+n.toFixed(0);
  return "—";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tierOf(r){
  const t=(r.tier||"").toLowerCase();
  if(t==="hot"||t==="warm"||t==="cool") return t;
  const v=num(r.implied_value_usd);
  if(v>=1e9) return "hot";
  if(v>=1e8) return "warm";
  return "cool";
}
function tierLabel(t){return t==="hot"?"Hot":t==="warm"?"Warm":"Watch";}
function chainsOf(r){
  if(Array.isArray(r.chains)) return r.chains;
  if(typeof r.chains==="string" && r.chains.trim()) return r.chains.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  return [];
}
function farmSteps(r){
  if(Array.isArray(r.farm_plan) && r.farm_plan.length) return r.farm_plan.map(s=>typeof s==="string"?{step:s}:s);
  if(Array.isArray(r.farm_steps) && r.farm_steps.length) return r.farm_steps.map(s=>typeof s==="string"?{step:s}:s);
  return [];
}
function factorsOf(r){
  const f=r.factors||r.score_factors||{};
  if(Array.isArray(f)) return f.map(x=>[x.label||x.name||"factor", x.value]);
  return Object.keys(f).map(k=>[k, f[k]]);
}

/* ---- board ---- */
const state={q:"",cat:"",chain:"",sort:"value",tier:"all"};
const qEl=document.getElementById("q"),catEl=document.getElementById("cat"),chainEl=document.getElementById("chain"),sortEl=document.getElementById("sort");
const rowsEl=document.getElementById("rows"),noresEl=document.getElementById("nores");

const cats=[...new Set(ROWS.map(r=>r.category).filter(Boolean))].sort();
cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;catEl.appendChild(o);});
const chains=[...new Set(ROWS.flatMap(chainsOf))].sort();
chains.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;chainEl.appendChild(o);});

function kpis(){
  const total=ROWS.length;
  const hot=ROWS.filter(r=>tierOf(r)==="hot").length;
  const warm=ROWS.filter(r=>tierOf(r)==="warm").length;
  const sum=ROWS.reduce((a,r)=>a+num(r.implied_value_usd),0);
  const top=ROWS.slice().sort((a,b)=>num(b.implied_value_usd)-num(a.implied_value_usd))[0];
  document.getElementById("kpis").innerHTML=
    `<span class="kpi">Watchlist<b>${total}</b></span>`+
    `<span class="kpi">Hot<b>${hot}</b></span>`+
    `<span class="kpi">Warm<b>${warm}</b></span>`+
    `<span class="kpi">Aggregate implied<b>${usd(sum)}</b></span>`+
    (top?`<span class="kpi">Top pick<b>${esc(top.name||top.protocol||"")}</b></span>`:"");
  document.getElementById("c-all").textContent=total;
  document.getElementById("c-hot").textContent=hot;
  document.getElementById("c-warm").textContent=warm;
  document.getElementById("c-cool").textContent=ROWS.filter(r=>tierOf(r)==="cool").length;
  document.getElementById("foot").textContent=
    "Snapshot: "+(DATA.source||"DefiLlama sealed snapshot")+(DATA.generated_at?" · generated "+DATA.generated_at:"")+
    " · "+total+" protocols · implied values are model estimates, not financial advice.";
}

function filtered(){
  const q=state.q.toLowerCase();
  let out=ROWS.filter(r=>{
    if(state.tier!=="all" && tierOf(r)!==state.tier) return false;
    if(state.cat && r.category!==state.cat) return false;
    if(state.chain && !chainsOf(r).includes(state.chain)) return false;
    if(q){
      const hay=[r.name,r.protocol,r.category,r.slug,(r.description||"")].concat(chainsOf(r)).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s=state.sort;
  out.sort((a,b)=>{
    if(s==="name") return String(a.name||a.protocol||"").localeCompare(String(b.name||b.protocol||""));
    if(s==="tvl") return num(b.tvl_usd)-num(a.tvl_usd);
    if(s==="fees") return num(b.fees_30d_usd)-num(a.fees_30d_usd);
    return num(b.implied_value_usd)-num(a.implied_value_usd);
  });
  return out;
}

function render(){
  const list=filtered();
  noresEl.classList.toggle("hide", list.length>0);
  rowsEl.innerHTML=list.map((r,i)=>{
    const t=tierOf(r);
    const v=num(r.implied_value_usd);
    const w=Math.max(3,Math.round(v/MAXV*100));
    return `<tr data-i="${ROWS.indexOf(r)}">
      <td class="rank">${i+1}</td>
      <td><div class="name">${esc(r.name||r.protocol||r.slug)}</div><div class="cat">${esc(r.slug||"")}</div></td>
      <td class="cat">${esc(r.category||"—")}</td>
      <td class="cat">${chainsOf(r).slice(0,3).map(esc).join(", ")||"—"}</td>
      <td class="mono">${usd(r.tvl_usd)}</td>
      <td class="mono">${usd(r.fees_30d_usd)}</td>
      <td><div class="val">${usd(v)}</div><div class="bar"><i style="width:${w}%"></i></div></td>
      <td><span class="tier t-${t}">${tierLabel(t)}</span></td>
    </tr>`;
  }).join("");
  rowsEl.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click",()=>openDetail(ROWS[Number(tr.dataset.i)]));
  });
}

qEl.addEventListener("input",e=>{state.q=e.target.value.trim();render();});
catEl.addEventListener("change",e=>{state.cat=e.target.value;render();});
chainEl.addEventListener("change",e=>{state.chain=e.target.value;render();});
sortEl.addEventListener("change",e=>{state.sort=e.target.value;render();});
document.querySelectorAll(".chip[data-tier]").forEach(ch=>{
  ch.addEventListener("click",()=>{
    document.querySelectorAll(".chip[data-tier]").forEach(c=>c.classList.remove("on"));
    ch.classList.add("on");
    state.tier=ch.dataset.tier;
    render();
  });
});

/* ---- detail ---- */
const boardEl=document.getElementById("board"),detailEl=document.getElementById("detail");
function openDetail(r){
  if(!r) return;
  const t=tierOf(r);
  const steps=farmSteps(r);
  const factors=factorsOf(r);
  const ch=chainsOf(r);
  const rank=ROWS.slice().sort((a,b)=>num(b.implied_value_usd)-num(a.implied_value_usd)).indexOf(r)+1;
  detailEl.innerHTML=`
    <a href="#" class="back" id="back">← Back to board</a>
    <div class="dhead">
      <div>
        <h2>${esc(r.name||r.protocol||r.slug)}</h2>
        <div class="meta">${esc(r.category||"Uncategorised")} · ${ch.map(esc).join(", ")||"chains unknown"} · rank #${rank} of ${ROWS.length}</div>
        <div style="margin-top:10px">${ch.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}<span class="tier t-${t}">${tierLabel(t)}</span></div>
      </div>
      <div class="dstats">
        <div class="dstat"><div class="l">Implied value</div><div class="v acc">${usd(r.implied_value_usd)}</div></div>
        <div class="dstat"><div class="l">TVL</div><div class="v">${usd(r.tvl_usd)}</div></div>
        <div class="dstat"><div class="l">Fees 30d</div><div class="v">${usd(r.fees_30d_usd)}</div></div>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>Farm plan</h3>
        ${steps.length?`<ol class="steps">${steps.map(s=>`<li><b>${esc(s.step||s.text||s.action||"")}</b>${s.why?`<span class="why">${esc(s.why)}</span>`:""}</li>`).join("")}</ol>`:`<div class="muted">No farm plan recorded for this protocol.</div>`}
        ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}
      </div>
      <div class="card">
        <h3>Value model</h3>
        ${factors.length?factors.map(([k,v])=>`<div class="factor"><span class="k">${esc(k)}</span><span class="v ${num(v)>0?"pos":""}">${typeof v==="number"?usd(v):esc(v)}</span></div>`).join(""):`<div class="muted">No factor breakdown recorded.</div>`}
        ${r.rationale?`<div class="note">${esc(r.rationale)}</div>`:""}
      </div>
    </div>`;
  boardEl.classList.add("hide");
  detailEl.classList.remove("hide");
  document.getElementById("back").addEventListener("click",e=>{e.preventDefault();closeDetail();});
  window.scrollTo(0,0);
}
function closeDetail(){
  detail
