<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#0f141c;--line:#1e2836;--txt:#dbe4ee;--dim:#7d8b9e;--acc:#3ddc97;--acc2:#5aa9ff;--warn:#ffb454;--hot:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;background:linear-gradient(180deg,#101722,#0b0f14)}
h1{font-size:18px;margin:0;letter-spacing:.5px}
h1 span{color:var(--acc)}
.meta{color:var(--dim);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;height:calc(100vh - 58px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.left{overflow:auto;border-right:1px solid var(--line)}
.right{overflow:auto;background:var(--panel2)}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit;font-size:13px}
input{min-width:180px;flex:1}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#04120b;border-color:var(--acc);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:52px;background:var(--panel);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;z-index:4}
td{padding:7px 10px;border-bottom:1px solid #151d28;vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:#141c27}
tr.row.sel td{background:#15241d;box-shadow:inset 3px 0 0 var(--acc)}
.rk{color:var(--dim);width:34px}
.name{color:var(--txt);font-weight:600}
.cat{color:var(--dim);font-size:11px}
.val{color:var(--acc);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc{text-align:right;font-variant-numeric:tabular-nums;color:var(--acc2)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
.badge.hi{color:var(--hot);border-color:#4a2230}
.badge.md{color:var(--warn);border-color:#4a3a20}
.detail{padding:18px 20px}
.detail h2{margin:0 0 2px;font-size:20px}
.detail .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.sec{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--acc2)}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin:6px 0}
.pill{display:inline-block;background:#16202c;border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin:2px 4px 2px 0;font-size:11px;color:var(--dim)}
.bar{height:6px;background:#16202c;border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.empty{color:var(--dim);padding:40px 20px;text-align:center}
a{color:var(--acc2)}
.note{color:var(--dim);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Token Launch <span>Radar</span></h1>
  <div class="meta" id="meta">loading board…</div>
</header>
<div class="wrap">
  <section class="left">
    <div class="controls">
      <input id="q" placeholder="search protocol, chain, category…" autocomplete="off">
      <select id="cat"><option value="">all categories</option></select>
      <select id="chain"><option value="">all chains</option></select>
      <select id="tier"><option value="">all tiers</option><option value="high">high conviction</option><option value="mid">mid</option><option value="low">speculative</option></select>
      <button id="reset">reset</button>
      <span class="meta" id="count"></span>
    </div>
    <table>
      <thead><tr>
        <th data-k="rank">#</th>
        <th data-k="name">Protocol</th>
        <th data-k="category">Category</th>
        <th data-k="chains">Chain</th>
        <th data-k="impliedValueUsd" class="val">Implied value</th>
        <th data-k="score" class="sc">Score</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <aside class="right" id="detail"><div class="empty">Select a protocol to see its launch case and farm plan.</div></aside>
</div>
<script>
(function(){
  "use strict";
  var DATA = window.__RADAR__ || null;
  var state = {q:"", cat:"", chain:"", tier:"", sort:"rank", dir:1, sel:null};
  var $ = function(id){return document.getElementById(id);};

  function fmtUsd(n){
    if(n==null||isNaN(n)) return "—";
    if(n>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
    if(n>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
    if(n>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
    return "$"+Math.round(n);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function chainsOf(r){
    if(Array.isArray(r.chains)) return r.chains;
    if(typeof r.chains==="string") return r.chains.split(/[,;|]/).map(function(s){return s.trim();}).filter(Boolean);
    return r.chain?[r.chain]:[];
  }
  function tierOf(r){
    var s = r.score||0;
    if(r.tier) return r.tier;
    return s>=70?"high":s>=45?"mid":"low";
  }
  function farmSteps(r){
    var p = r.farmPlan||r.farm||null;
    if(Array.isArray(p)) return p;
    if(p && Array.isArray(p.steps)) return p.steps;
    if(typeof p==="string") return p.split(/\n+/).filter(Boolean);
    return [];
  }

  function load(){
    if(DATA && Array.isArray(DATA.rows)){ init(DATA); return; }
    // Fallback: fetch board.json relative to the page (works when served over http).
    var xhr = new XMLHttpRequest();
    xhr.open("GET","../board.json",true);
    xhr.onload = function(){
      try{
        var j = JSON.parse(xhr.responseText);
        init(Array.isArray(j)?{rows:j}:j);
      }catch(e){ fail("board.json could not be parsed: "+e.message); }
    };
    xhr.onerror = function(){ fail("No embedded data and board.json is unreachable. Open dashboard/index.html next to board.json."); };
    xhr.send();
  }
  function fail(msg){ $("meta").textContent = msg; $("detail").innerHTML = '<div class="empty">'+esc(msg)+'</div>'; }

  function init(d){
    var rows = d.rows.slice();
    rows.sort(function(a,b){return (a.rank||0)-(b.rank||0);});
    rows.forEach(function(r,i){ if(r.rank==null) r.rank=i+1; });
    window.__ROWS__ = rows;
    var cats = {}, chs = {};
    rows.forEach(function(r){
      if(r.category) cats[r.category]=1;
      chainsOf(r).forEach(function(c){ if(c) chs[c]=1; });
    });
    Object.keys(cats).sort().forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; $("cat").appendChild(o); });
    Object.keys(chs).sort().forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; $("chain").appendChild(o); });
    var gen = d.generatedAt||d.generated_at||"";
    $("meta").textContent = rows.length+" protocols · snapshot "+(gen?gen.slice(0,19).replace("T"," "):"n/a")+" · ranked by implied launch value";
    bind();
    render();
    if(rows.length) select(rows[0].id||rows[0].slug||rows[0].name);
  }

  function bind(){
    $("q").addEventListener("input",function(e){state.q=e.target.value.toLowerCase();render();});
    $("cat").addEventListener("change",function(e){state.cat=e.target.value;render();});
    $("chain").addEventListener("change",function(e){state.chain=e.target.value;render();});
    $("tier").addEventListener("change",function(e){state.tier=e.target.value;render();});
    $("reset").addEventListener("click",function(){
      state.q="";state.cat="";state.chain="";state.tier="";state.sort="rank";state.dir=1;
      $("q").value="";$("cat").value="";$("chain").value="";$("tier").value="";render();
    });
    Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){
      th.addEventListener("click",function(){
        var k=th.getAttribute("data-k");
        if(state.sort===k) state.dir*=-1; else {state.sort=k;state.dir=1;}
        render();
      });
    });
  }

  function filtered(){
    var rows = window.__ROWS__;
    return rows.filter(function(r){
      if(state.cat && r.category!==state.cat) return false;
      if(state.chain && chainsOf(r).indexOf(state.chain)<0) return false;
      if(state.tier && tierOf(r)!==state.tier) return false;
      if(state.q){
        var hay = [r.name,r.category,r.description,r.slug].concat(chainsOf(r)).join(" ").toLowerCase();
        if(hay.indexOf(state.q)<0) return false;
      }
      return true;
    });
  }

  function sortRows(rows){
    var k=state.sort, d=state.dir;
    var copy = rows.slice();
    copy.sort(function(a,b){
      var av,bv;
      if(k==="chains"){av=chainsOf(a).join(",");bv=chainsOf(b).join(",");}
      else if(k==="impliedValueUsd"){av=a.impliedValueUsd||0;bv=b.impliedValueUsd||0;}
      else {av=a[k];bv=b[k];}
      if(typeof av==="string"||typeof bv==="string"){
        av=String(av||"").toLowerCase();bv=String(bv||"").toLowerCase();
        return av<bv?-d:av>bv?d:0;
      }
      av=av||0;bv=bv||0;
      return (av-bv)*d;
    });
    return copy;
  }

  function render(){
    var rows = sortRows(filtered());
    var tb = $("rows");
    var html = "";
    rows.forEach(function(r){
      var id = r.id||r.slug||r.name;
      var t = tierOf(r);
      html += '<tr class="row'+(state.sel===id?" sel":"")+'" data-id="'+esc(id)+'">'+
        '<td class="rk">'+esc(r.rank)+'</td>'+
        '<td><span class="name">'+esc(r.name)+'</span>'+(t==="high"?'<span class="badge hi">hot</span>':t==="mid"?'<span class="badge md">mid</span>':'')+'</td>'+
        '<td class="cat">'+esc(r.category||"—")+'</td>'+
        '<td class="cat">'+esc(chainsOf(r).slice(0,2).join(", ")||"—")+'</td>'+
        '<td class="val">'+fmtUsd(r.impliedValueUsd)+'</td>'+
        '<td class="sc">'+esc(r.score!=null?Math.round(r.score):"—")+'</td>'+
      '</tr>';
    });
    tb.innerHTML = html || '<tr><td colspan="6" class="empty">No protocols match these filters.</td></tr>';
    $("count").textContent = rows.length+" shown";
    Array.prototype.forEach.call(tb.querySelectorAll("tr.row"),function(tr){
      tr.addEventListener("click",function(){ select(tr.getAttribute("data-id")); });
    });
  }

  function find(id){
    var rows = window.__ROWS__||[];
    for(var i=0;i<rows.length;i++){ if((rows[i].id||rows[i].slug||rows[i].name)===id) return rows[i]; }
    return null;
  }

  function select(id){
    state.sel = id;
    Array.prototype.forEach.call(document.querySelectorAll("tr.row"),function(tr){
      tr.classList.toggle("sel", tr.getAttribute("data-id")===id);
    });
    var r = find(id);
    if(!r) return;
    renderDetail(r);
  }

  function renderDetail(r){
    var t = tierOf(r);
    var steps = farmSteps(r);
    var chs = chainsOf(r);
    var maxV = (window.__ROWS__||[]).reduce(function(m,x){return Math.max(m,x.impliedValueUsd||0);},1);
    var pct = Math.max(2, Math.min(100, ((r.impliedValueUsd||0)/maxV)*100));
    var h = '<div class="detail">';
    h += '<h2>'+esc(r.name)+'</h2>';
    h += '<div class="sub">'+esc(r.category||"uncategorized")+' · '+esc(chs.join(", ")||"chain n/a")+' · rank #'+esc(r.rank)+'</div>';
    if(r.description) h += '<p>'+esc(r.description)+'</p>';
    h += '<dl class="kv">';
    h += '<dt>Implied value</dt><dd class="val" style="text-align:left">'+fmtUsd(r.impliedValueUsd)+'<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div></dd>';
    h += '<dt>Launch score</dt><dd>'+esc(r.score!=null?Math.round(r.score):"—")+' / 100 <span class="badge '+(t==="high"?"hi":t==="mid"?"md":"")+'">'+esc(t)+'</span></dd>';
    if(r.tvlUsd!=null) h += '<dt>TVL</dt><dd>'+fmtUsd(r.tvlUsd)+'</dd>';
    if(r.feesUsd!=null) h += '<dt>Fees (30d)</dt><dd>'+fmtUsd(r.feesUsd)+'</dd>';
    if(r.revenueUsd!=null) h += '<dt>Revenue (30d)</dt><dd>'+fmtUsd(r.revenueUsd)+'</dd>';
    if(r.valuationBasis) h += '<dt>Value basis</dt><dd>'+esc(r.valuationBasis)+'</dd>';
    if(r.tokenStatus) h += '<dt>Token status</dt><dd>'+esc(r.tokenStatus)+'</dd>';
    if(r.whyNoToken) h += '<dt>Why no token</dt><dd>'+esc(r.whyNoToken)+'</dd>';
    h += '</dl>';
    if(Array.isArray(r.signals)&&r.signals.length){
      h += '<div class="sec"><h3>Signals</h3>';
      r.signals.forEach(function(s){ h += '<span class="pill">'+esc(s)+'</span>'; });
      h += '</div>';
    }
    if(Array.isArray(r.risks)&&r.risks.length){
      h += '<div class="sec"><h3>Risks</h3>';
      r.risks.forEach(function(s){ h += '<span class="pill">'+esc(s)+'</span>'; });
      h += '</div>';
    }
    h += '<div class="sec"><h3>Farm plan</h3>';
    if(steps.length){
      h += '<ol class="steps">';
      steps.forEach(function(s){ h += '<li>'+esc(s)+'</li>'; });
      h += '</ol>';
    } else {
      h += '<div class="note">No farm plan recorded for this protocol.</div>';
    }
    if(r.farmPlan && r.farmPlan.expectedValue) h += '<div class="note">Expected value: '+esc(r.farmPlan.expectedValue)+'</div>';
    h += '</div>';
    if(Array.isArray(r.links)&&r.links.length){
      h += '<div class="sec"><h3>Links</h3>';
      r.links.forEach(function(l){
        var url = typeof l==="string"?l:(l.url||"");
        var label = typeof l==="string"?l:(l.label||l.url||"");
        h += '<div><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+'</a></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    $("detail").innerHTML = h;
    $("detail").scrollTop = 0;
  }

  load();
})();
</script>
</body>
</html>
